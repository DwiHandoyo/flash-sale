# nginx in front of the system (docs/10-infrastructure.md): serves the React build and spreads
# /api requests over the API servers. Runs as a non-root user, so it listens on 8080 and keeps its
# temporary files in /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
# Every proxied request holds two connections, one from the browser and one to an API server.
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65s;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Only server errors are logged: under flash-sale load, a line per request costs more than it
  # tells. The API servers log their own errors too.
  map $status $is_server_error {
    ~^5     1;
    default 0;
  }
  log_format brief '$remote_addr "$request" $status ${request_time}s '
                   'upstream=$upstream_addr upstream_status=$upstream_status';
  access_log /dev/stdout brief if=$is_server_error;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's DNS. The name `api` returns one address per replica. `resolve` below looks it up
  # again every few seconds, so restarted or added replicas are picked up.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream api {
    zone api 64k;
    server api:3000 resolve max_fails=1 fail_timeout=5s;
    # Reuse connections to the API servers instead of opening one per request.
    keepalive 256;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # A dead server is detected quickly. A slow one gets longer: the API itself gives up on
      # Redis and RabbitMQ after a few seconds.
      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
      # When a server is down or does not answer, try another one. This includes POST, because
      # a purchase is idempotent: a second attempt returns the same order (docs/07, D5).
      # 5xx answers are not retried: they are the API's own, deliberate replies.
      proxy_next_upstream error timeout non_idempotent;
      proxy_next_upstream_tries 2;
    }

    # File names contain a content hash, so they never change.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell is checked on every visit, so a new build shows up at once.
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
