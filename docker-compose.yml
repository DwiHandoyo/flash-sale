name: flash-sale

services:
  redis:
    image: redis:8.2-alpine
    # Every write is synced to disk before Redis replies (see docs/07-decisions.md, D7).
    # REDIS_APPENDFSYNC=everysec is only for the stress-test comparison.
    command: >-
      redis-server
      --appendonly yes
      --appendfsync ${REDIS_APPENDFSYNC:-always}
      --maxmemory-policy noeviction
    ports:
      - '${REDIS_HOST_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    # A fixed hostname keeps the node name, and therefore its stored data, stable across restarts.
    hostname: rabbitmq
    # Run as the rabbitmq user, so CLI tools started with `docker compose exec` never create a
    # root-owned .erlang.cookie that the server cannot read.
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: flash
      RABBITMQ_DEFAULT_PASS: flash
      # Erlang schedulers spin while idle by default; stop that so the broker does not burn the
      # CPU that the API and the stress-test generator share on a laptop.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+sbwt none +sbwtdcpu none +sbwtdio none'
    ports:
      - '${RABBITMQ_HOST_PORT:-5672}:5672'
      - '${RABBITMQ_DASHBOARD_HOST_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # The HTTP health endpoint is cheap. `rabbitmq-diagnostics` boots a whole Erlang VM on
      # every call, which is too slow for a healthcheck.
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://flash:flash@127.0.0.1:15672/api/health/checks/port-listener/5672 | grep -q ok',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flash_sale
    ports:
      - '${POSTGRES_HOST_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flash -d flash_sale']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
